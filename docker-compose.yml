version: "3.9"

services:
  node:
    image: node:20-alpine
    container_name: node-app
    working_dir: /app
    volumes:
      - ./app:/app
    command: sh -c "npm install && npm start"
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - node
    restart: unless-stopped
